# Apache trong container trên gói miễn phí (512 MB RAM, chạy chung MariaDB): ít tiến trình, đủ cho vài chục người dùng
ServerName localhost

<IfModule mpm_prefork_module>
    StartServers         2
    MinSpareServers      2
    MaxSpareServers      4
    MaxRequestWorkers    12
    MaxConnectionsPerChild 500
</IfModule>
