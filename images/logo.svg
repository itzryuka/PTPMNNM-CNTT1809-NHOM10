<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OmniStock">
  <!-- Logo OmniStock: thùng hàng 3 mặt (tồn kho) + vòng "O" trên nắp (Omni = mọi kho, mọi điểm) -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <polygon points="16,2.5 28.5,9.5 16,16.5 3.5,9.5" fill="url(#top)"/>
  <polygon points="3.5,9.5 16,16.5 16,30 3.5,23" fill="url(#left)"/>
  <polygon points="16,16.5 28.5,9.5 28.5,23 16,30" fill="url(#right)"/>
  <path d="M16 16.5 V30" stroke="#BFDBFE" stroke-opacity="0.35" stroke-width="0.8"/>
  <ellipse cx="16" cy="9.5" rx="5.6" ry="3.15" fill="none" stroke="#FFFFFF" stroke-width="1.7"/>
</svg>
